services:
  metan:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - EARTHDATA_USERNAME=${EARTHDATA_USERNAME}
      - EARTHDATA_PASSWORD=${EARTHDATA_PASSWORD}
      - BACKFILL_DAYS=${BACKFILL_DAYS:-90}
      # Gizli değerler yalnızca Coolify ortam değişkenlerinde tutulur; tarayıcıya gönderilmez
      - EARTHDATA_TOKEN=${EARTHDATA_TOKEN:-}
      - CARBON_MAPPER_API_TOKEN=${CARBON_MAPPER_API_TOKEN:-}
      # CDS (ERA5) ve Copernicus Data Space; tanımlı değilse ilgili akış "bağlanmamış" görünür
      - CDSE_CLIENT_ID=${CDSE_CLIENT_ID:-}
      - CDSE_CLIENT_SECRET=${CDSE_CLIENT_SECRET:-}
      - CDSAPI_URL=${CDSAPI_URL:-https://cds.climate.copernicus.eu/api}
      - CDSAPI_KEY=${CDSAPI_KEY:-}
      # Yönetici uçları (inceleme, elle iş hattı, içe aktarma listesi); boşsa bu uçlar kapalıdır
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # İsteğe bağlı mutlak kg/sa aday eşiği; varsayılan yok (evrensel eşik uydurulmaz)
      - PEAK_ABSOLUTE_KGH=${PEAK_ABSOLUTE_KGH:-}
      - APP_ENV=${APP_ENV:-production}
    volumes:
      - metan-data:/data

volumes:
  metan-data:
